<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>midi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>GIF 만들기</h1>
      <p class="hint">샘플 영상을 만들거나, 주 모니터에서 드래그한 영역을 녹화해 GIF로 만듭니다.</p>

      <form id="settings">
        <label>
          프레임 수(fps)
          <select id="fps">
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="30" selected>30</option>
          </select>
        </label>
        <label>
          색 수 <output id="colors-value">255</output>
          <input id="colors" type="range" min="2" max="255" value="255" />
        </label>
        <label>
          디더링 강도 <output id="dither-value">1</output>
          <input id="dither" type="range" min="0" max="1" step="0.05" value="1" />
        </label>
        <label>
          열화 정도 <output id="tolerance-value">0</output>
          <input id="tolerance" type="range" min="0" max="32" value="0" />
          <small class="hint">녹화에만 적용됩니다. 이 값 이하의 작은 색 변화는 안 바뀐 것으로 보고 용량을 줄입니다.</small>
        </label>
        <label>
          녹화 해상도
          <select id="scale">
            <option value="100" selected>100% (그대로)</option>
            <option value="75">75%</option>
            <option value="50">50%</option>
            <option value="33">33%</option>
            <option value="25">25%</option>
          </select>
        </label>
        <div class="actions">
          <button id="make" type="submit">샘플 만들기</button>
          <button id="record" type="button">녹화 시작</button>
          <button id="cancel" type="button" aria-label="녹화 취소" hidden>✕</button>
        </div>
      </form>

      <p id="hotkey" class="hint"></p>
      <p id="status" role="status">설정을 고르고 버튼을 누르세요.</p>
      <p id="saved" hidden>
        <span id="saved-path"></span>
        <button id="show-saved" type="button">폴더에서 보기</button>
      </p>
      <img id="preview" alt="만들어진 GIF 미리보기" hidden />
    </main>
    <script src="main.js"></script>
  </body>
</html>

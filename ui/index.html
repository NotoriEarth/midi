<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>midi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>GIF 만들기</h1>
      <p class="hint">샘플 영상이나 주 모니터 왼쪽 위 480×270 영역을 GIF로 만들어 이 창에서 바로 봅니다.</p>

      <form id="settings">
        <label>
          프레임 수(fps)
          <select id="fps">
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="30" selected>30</option>
          </select>
        </label>
        <label>
          색 수 <output id="colors-value">255</output>
          <input id="colors" type="range" min="2" max="255" value="255" />
        </label>
        <label>
          디더링 강도 <output id="dither-value">1</output>
          <input id="dither" type="range" min="0" max="1" step="0.05" value="1" />
        </label>
        <label>
          녹화 길이
          <select id="seconds">
            <option value="1">1초</option>
            <option value="3" selected>3초</option>
            <option value="5">5초</option>
            <option value="10">10초</option>
          </select>
        </label>
        <div class="actions">
          <button id="make" type="submit">샘플 만들기</button>
          <button id="record" type="button">화면 녹화</button>
        </div>
      </form>

      <p id="status" role="status">설정을 고르고 버튼을 누르세요.</p>
      <img id="preview" alt="만들어진 GIF 미리보기" hidden />
    </main>
    <script src="main.js"></script>
  </body>
</html>
